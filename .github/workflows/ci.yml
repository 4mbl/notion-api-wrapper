name: CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 3' # weekly on wednesdays at 00:00

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    timeout-minutes: 10
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
            cache: true
            install: true
      - name: Format
        run: pnpm run format:check
      - name: Lint
        run: pnpm run lint
      - name: Build
        run: pnpm run build
      - name: Test
        run: pnpm run test
        env:
          TESTING_NOTION_TOKEN: ${{ secrets.TESTING_NOTION_TOKEN }}
          TESTING_PERSON_ID: ${{ secrets.TESTING_PERSON_ID }}
